<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<!-- ===== Right Quick Nav (generated by JS) ===== -->
<nav class="quick-nav" id="quickNav"></nav>

<!-- ===== HERO ===== -->
<!-- See components/hero.html -->

<div class="container">

  <!-- ===== TRANSPORT CARD ===== -->
  <!-- See components/transport.html -->

  <!-- ===== HOTEL SUMMARY ===== -->
  <!-- See components/hotel-summary.html -->

  <!-- ===== DAY CARDS ===== -->
  <!-- See components/day-card.html -->

  <!-- ===== FOOD SUMMARY ===== -->
  <!-- See components/food-grid.html -->

  <!-- ===== AVOID LIST ===== -->
  <!-- See components/avoid-list.html -->

  <!-- ===== BUDGET CARD ===== -->
  <!-- See components/budget.html -->

  <!-- ===== TIPS CARD ===== -->
  <!-- See components/tips.html -->

  <!-- ===== FOOTER ===== -->
  <!-- See components/footer.html -->

</div>

<!-- ===== Scripts ===== -->
<script>
// === Quick Nav: Auto-generate from sections ===
(function() {
  const sections = document.querySelectorAll('[data-nav]');
  const nav = document.getElementById('quickNav');
  if (!nav || !sections.length) return;

  sections.forEach(s => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.innerHTML = `<span class="nav-dot"></span><span class="nav-label">${s.dataset.nav}</span>`;
    item.addEventListener('click', () => {
      s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nav.appendChild(item);
  });

  // Scroll spy
  const items = nav.querySelectorAll('.nav-item');
  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(s => {
      if (window.scrollY >= s.offsetTop - 100) current = s.dataset.nav;
    });
    items.forEach((item, i) => {
      item.classList.toggle('active', item.querySelector('.nav-label').textContent === current);
    });
  });
})();

// === Collapse: Day cards ===
document.querySelectorAll('.day-card .day-header').forEach(header => {
  header.addEventListener('click', () => {
    header.parentElement.classList.toggle('collapsed');
  });
});

// === Collapse: Other sections with .collapsible class ===
document.querySelectorAll('.collapsible').forEach(el => {
  el.addEventListener('click', () => {
    el.classList.toggle('collapsed');
    const content = el.nextElementSibling;
    if (content && content.classList.contains('collapse-content')) {
      content.classList.toggle('collapsed');
    }
  });
});
</script>

</body>
</html>
