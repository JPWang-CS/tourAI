<!--
  Hero Component
  Displays destination title, subtitle, emoji banner, and style tags
  Data from: trip.title, trip.subtitle, trip.destination, trip.style, trip.duration_days
-->
<section class="hero">
  <div class="hero-inner">
    <div class="emojis">{{EMOJIS}}</div>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="tag-row">
      {{TAGS}}
    </div>
  </div>
</section>
